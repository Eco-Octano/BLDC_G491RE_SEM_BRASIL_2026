; SPI LAB - NUCLEO-G491RE
; Projeto de estudo e pratica de SPI. Sem SimpleFOC, sem shield.
;
; As cinco linhas marcadas [G491] existem por causa de armadilhas da
; NUCLEO-G491RE no PlatformIO. Leia tools/SETUP.md antes de mexer nelas.

[platformio]
default_envs = spi_lab
boards_dir   = boards

[env:spi_lab]
platform  = ststm32
; [G491] 1 - o board oficial "nucleo_g491re" NAO declara o framework arduino,
; so' stm32cube. Usamos o customizado em boards/.
board     = nucleo_g491re_arduino
framework = arduino

; [G491] 2 - a variante generica do stm32duino nao tem header de placa.
; Sem isto o build procura variant_NUCLEO_G491RE_ARDUINO.h e falha.
board_build.variant_h = variant_generic.h

; [G491] 2b - copia o header de redirecionamento para dentro do pacote do
; framework antes de cada build. Sem isto, todo computador novo e toda
; reinstalacao exigem copiar o arquivo a mao.
extra_scripts = pre:tools/install_variant.py

; [G491] 3 - o G491 tem 112 KB de RAM CONTIGUA (a CCM fica em endereco
; separado). O core declara 128 KB, que e' o valor do G4A1 - a variante e'
; compartilhada. Com 128 KB o linker poe a pilha em memoria inexistente e o
; firmware da' HardFault antes do main(). O JSON sozinho nao basta.
board_upload.maximum_ram_size = 114688

upload_protocol = custom
; [G491] 4 - a placa tem ST-Link V3E, que fala 'dapdirect_swd'. O
; upload_protocol=stlink padrao passa interface/stlink.cfg assumindo V2 e
; falha com "Debug adapter doesn't support 'hla_swd' transport".
; Grava o .ELF: o .bin nao carrega endereco e vai parar em 0x00000000.
upload_command = openocd -s "$PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32g4x.cfg -c "program {$BUILD_DIR/firmware.elf} verify reset; shutdown"

debug_tool   = custom
debug_server =
    openocd
    -s
    $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts
    -f
    interface/stlink.cfg
    -c
    transport select swd
    -f
    target/stm32g4x.cfg

monitor_speed = 115200
build_flags   = -O2
