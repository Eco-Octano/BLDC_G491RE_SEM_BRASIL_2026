; =====================================================================
;  Eco Octano UFPR - ESC custom
;  NUCLEO-G491RE + shield ESC (DRV8353RS)
;
;  Duas builds do MESMO codigo, diferindo apenas na topologia de leitura
;  de corrente. E' isso que permite comparar as duas medidas sem comparar
;  dois firmwares diferentes.
;
;    pio run -e inline    -t upload
;    pio run -e lowside   -t upload
; =====================================================================

[platformio]
default_envs = lowside

; ---------------------------------------------------------- comum
[common]
platform  = ststm32
board     = nucleo_g491re
framework = arduino

; A SimpleFOC exige isto. Sem lib_archive = no o linker descarta os
; construtores estaticos das classes de hardware especifico e a placa
; trava sem mensagem nenhuma.
lib_archive = no

lib_deps =
    askuric/Simple FOC@^2.4.0
    simplefoc/SimpleFOCDrivers@^1.0.8

upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200

; -O2 e nao -Os: o laco de FOC e' sensivel a tempo e nao a tamanho.
; O G491 tem 512 kB de flash, espaco nao e' a restricao aqui.
build_flags =
    -O2
    -D HAL_OPAMP_MODULE_ENABLED

; ------------------------------------------------- leitura INLINE
; Shunt de 3 mOhm + INA240A1 (20 V/V) -> 60 mV/A, repouso em 1,65 V.
; Tres fases medidas. Leitura por conversao REGULAR (assincrona ao PWM).
[env:inline]
extends = common
build_flags =
    ${common.build_flags}
    -D CS_MODE_INLINE

; ---------------------------------------------- leitura LOW-SIDE
; Shunt de 3 mOhm + CSA interno do DRV8353RS (ganho por SPI, fixado em
; 20 V/V) -> mesma escala de 60 mV/A. Duas fases (A e C, ambas no ADC1),
; fase B reconstruida por Ia+Ib+Ic=0.
; Leitura por conversao INJETADA, sincrona ao TIM1.
[env:lowside]
extends = common
build_flags =
    ${common.build_flags}
    -D CS_MODE_LOWSIDE
