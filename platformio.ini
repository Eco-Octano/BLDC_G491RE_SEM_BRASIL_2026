; ESC Eco Octano UFPR — NUCLEO-G491RE + Ouroboros (DRV8353RS)
;
; As cinco linhas marcadas [G491] contornam armadilhas desta placa no
; PlatformIO. Nenhuma é opcional — ver a seção "Armadilhas" do README.

[platformio]
default_envs = ouroboros
boards_dir   = boards

[env:ouroboros]
platform  = ststm32
framework = arduino

; [G491] 1 — o board oficial "nucleo_g491re" não declara o framework
; arduino, só stm32cube. Usamos o customizado em boards/.
board = nucleo_g491re_arduino

; [G491] 2 — a variante genérica do stm32duino não tem header de placa.
board_build.variant_h = variant_generic.h
extra_scripts         = pre:tools/install_variant.py

; [G491] 3 — o G491 tem 112 KB de RAM contígua; a CCM fica em endereço
; separado. O core declara 128 KB, valor do G4A1, porque a variante é
; compartilhada. Com 128 KB o linker põe a pilha em memória inexistente e
; o firmware dá HardFault antes do main().
board_upload.maximum_ram_size = 114688

; [G491] 4 — a placa tem ST-Link V3E, que fala dapdirect_swd. O
; upload_protocol=stlink padrão assume V2 e falha com "Debug adapter
; doesn't support 'hla_swd' transport". Grava o .elf: o .bin não carrega
; endereço e vai parar em 0x00000000.
upload_protocol = custom
upload_command  = openocd -s "$PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32g4x.cfg -c "program {$BUILD_DIR/firmware.elf} verify reset; shutdown"

debug_tool   = custom
debug_server =
    openocd
    -s
    $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts
    -f
    interface/stlink.cfg
    -c
    transport select swd
    -f
    target/stm32g4x.cfg

build_flags =
    -O2
    -I include

monitor_speed = 115200
; Porta da FTDI, não a VCP do ST-Link: a USART2 que alimenta a VCP tem o
; TX em PA2, que nesta placa é o LSCS_A.
; monitor_port = COM11

; No Windows, o GNU ld não lida com acento no caminho do projeto: o build
; falha com "cannot open map file". Se o caminho tiver acento, descomente:
; build_dir   = C:/pio/build/$PROJECT_HASH
; libdeps_dir = C:/pio/lib
